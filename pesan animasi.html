<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Romantis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            position: relative;
        }
        
        /* Animated Hearts Background */
        .background-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .heart {
            position: absolute;
            opacity: 0;
            animation: floatHeart 10s ease-in-out infinite;
        }
        
        .heart:before,
        .heart:after {
            content: "";
            position: absolute;
            width: 20px;
            height: 33px;
            background: rgba(255, 125, 125, 0.4);
            border-radius: 50px 50px 0 0;
        }
        
        .heart:before {
            transform: rotate(-45deg);
            transform-origin: 100% 100%;
            left: 0;
        }
        
        .heart:after {
            transform: rotate(45deg);
            transform-origin: 0 100%;
            left: 14.5px;
        }
        
        /* Light Effect */
        .light-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.2), transparent 70%);
            pointer-events: none;
            z-index: 1;
        }
        
        /* Rose Petals */
        .rose-petal {
            position: absolute;
            width: 15px;
            height: 20px;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            border-radius: 40% 70% 50% 40%;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            opacity: 0;
            animation: fallingPetal 12s linear infinite;
        }
        
        /* Message Container */
        .message-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            text-align: center;
            overflow: hidden;
            animation: fadeIn 1s ease-in;
        }
        
        .message-header {
            margin-bottom: 20px;
            color: #ff5a87;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        .message-input {
            position: relative;
            margin-bottom: 20px;
        }
        
        .message-textarea {
            width: 100%;
            min-height: 100px;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid rgba(255, 90, 135, 0.3);
            resize: none;
            font-size: 16px;
            line-height: 1.5;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: rgba(255, 255, 255, 0.8);
        }
        
        .message-textarea:focus {
            outline: none;
            border-color: #ff5a87;
            box-shadow: 0 0 10px rgba(255, 90, 135, 0.3);
        }
        
        .message-textarea::placeholder {
            color: #ccc;
        }
        
        .char-counter {
            position: absolute;
            bottom: 5px;
            right: 15px;
            font-size: 12px;
            color: #999;
        }
        
        .message-preview {
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            background-color: rgba(255, 90, 135, 0.1);
            display: none;
            position: relative;
            transition: all 0.3s;
        }
        
        .preview-text {
            color: #555;
            line-height: 1.6;
            font-size: 16px;
        }
        
        .corner-heart {
            position: absolute;
            width: 20px;
            height: 20px;
            color: rgba(255, 90, 135, 0.5);
        }
        
        .top-left {
            top: 5px;
            left: 5px;
        }
        
        .top-right {
            top: 5px;
            right: 5px;
        }
        
        .bottom-left {
            bottom: 5px;
            left: 5px;
        }
        
        .bottom-right {
            bottom: 5px;
            right: 5px;
        }
        
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .button {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        
        .preview-button {
            background-color: #ff5a87;
            color: white;
        }
        
        .preview-button:hover {
            background-color: #ff3a67;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 90, 135, 0.4);
        }
        
        .copy-button, .send-button {
            background-color: #5a7fff;
            color: white;
            display: none;
        }
        
        .copy-button:hover, .send-button:hover {
            background-color: #3a5fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(90, 127, 255, 0.4);
        }
        
        .reset-button {
            background-color: #f0f0f0;
            color: #666;
        }
        
        .reset-button:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
            z-index: 100;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        /* URL Share Section */
        .share-section {
            margin-top: 20px;
            display: none;
        }
        
        .share-url {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .share-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        /* Animations */
        @keyframes floatHeart {
            0% {
                transform: translateY(110vh) translateX(0) scale(0.8);
                opacity: 0;
            }
            5% {
                opacity: 0.6;
            }
            95% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) translateX(var(--tx)) scale(1);
                opacity: 0;
            }
        }
        
        @keyframes fallingPetal {
            0% {
                transform: translateY(-50px) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(calc(100vh + 50px)) translateX(var(--tx)) rotate(var(--rotate));
                opacity: 0;
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
        
        /* Responsive styles */
        @media (max-width: 600px) {
            .message-container {
                padding: 20px;
                width: 95%;
            }
            
            .message-header {
                font-size: 20px;
            }
            
            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }
            
            .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Background Hearts -->
    <div class="background-hearts"></div>
    
    <!-- Rose Petals -->
    <div id="rosePetals"></div>
    
    <!-- Light Effect -->
    <div class="light-effect"></div>
    
    <!-- Message Container -->
    <div class="message-container">
        <h1 class="message-header">Pesan Romantis</h1>
        
        <div class="message-input">
            <textarea class="message-textarea" id="messageText" placeholder="Tulis pesan romantismu di sini..." maxlength="500"></textarea>
            <div class="char-counter" id="charCounter">0/500</div>
        </div>
        
        <div class="message-preview" id="messagePreview">
            <span class="corner-heart top-left">❤️</span>
            <span class="corner-heart top-right">❤️</span>
            <p class="preview-text" id="previewText"></p>
            <span class="corner-heart bottom-left">❤️</span>
            <span class="corner-heart bottom-right">❤️</span>
        </div>
        
        <div class="action-buttons">
            <button class="button preview-button" id="previewButton">Pratinjau</button>
            <button class="button copy-button" id="copyButton">Salin Pesan</button>
            <button class="button send-button" id="shareButton">Bagikan</button>
            <button class="button reset-button" id="resetButton">Reset</button>
        </div>
        
        <div class="share-section" id="shareSection">
            <p class="share-text">Link pesan romantismu (salin dan bagikan):</p>
            <input type="text" class="share-url" id="shareUrl" readonly>
        </div>
    </div>
    
    <!-- Toast Notification -->
    <div class="toast" id="toast">Pesan disalin!</div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Create background hearts
            const backgroundHearts = document.querySelector('.background-hearts');
            for (let i = 0; i < 20; i++) {
                createHeart(backgroundHearts);
            }
            
            // Create rose petals
            const rosePetals = document.getElementById('rosePetals');
            for (let i = 0; i < 30; i++) {
                createRosePetal(rosePetals);
            }
            
            // Get URL parameters if any
            const urlParams = new URLSearchParams(window.location.search);
            const messageParam = urlParams.get('message');
            
            // References to DOM elements
            const messageText = document.getElementById('messageText');
            const charCounter = document.getElementById('charCounter');
            const messagePreview = document.getElementById('messagePreview');
            const previewText = document.getElementById('previewText');
            const previewButton = document.getElementById('previewButton');
            const copyButton = document.getElementById('copyButton');
            const shareButton = document.getElementById('shareButton');
            const resetButton = document.getElementById('resetButton');
            const toast = document.getElementById('toast');
            const shareSection = document.getElementById('shareSection');
            const shareUrl = document.getElementById('shareUrl');
            
            // If message parameter exists, show it directly
            if (messageParam) {
                const decodedMessage = decodeURIComponent(messageParam);
                messageText.value = decodedMessage;
                previewText.innerHTML = formatMessage(decodedMessage);
                messagePreview.style.display = 'block';
                copyButton.style.display = 'block';
                shareButton.style.display = 'block';
                updateCharCounter();
            }
            
            // Event listeners
            messageText.addEventListener('input', updateCharCounter);
            
            previewButton.addEventListener('click', function() {
                const text = messageText.value.trim();
                if (text.length === 0) {
                    showToast('Silakan tulis pesan terlebih dahulu!');
                    return;
                }
                
                previewText.innerHTML = formatMessage(text);
                messagePreview.style.display = 'block';
                copyButton.style.display = 'block';
                shareButton.style.display = 'block';
                
                // Add heart animation to preview
                messagePreview.style.animation = 'heartbeat 1s infinite';
                setTimeout(() => {
                    messagePreview.style.animation = '';
                }, 3000);
            });
            
            copyButton.addEventListener('click', function() {
                navigator.clipboard.writeText(messageText.value)
                    .then(() => {
                        showToast('Pesan disalin!');
                    })
                    .catch(err => {
                        showToast('Gagal menyalin pesan.');
                        console.error('Error copying text: ', err);
                    });
            });
            
            shareButton.addEventListener('click', function() {
                const text = encodeURIComponent(messageText.value);
                const url = `${window.location.origin}${window.location.pathname}?message=${text}`;
                shareUrl.value = url;
                shareSection.style.display = 'block';
                
                shareUrl.select();
                showToast('Link siap dibagikan!');
            });
            
            resetButton.addEventListener('click', function() {
                messageText.value = '';
                previewText.innerHTML = '';
                messagePreview.style.display = 'none';
                copyButton.style.display = 'none';
                shareButton.style.display = 'none';
                shareSection.style.display = 'none';
                updateCharCounter();
            });
            
            shareUrl.addEventListener('click', function() {
                this.select();
            });
            
            // Functions
            function updateCharCounter() {
                const length = messageText.value.length;
                charCounter.textContent = `${length}/500`;
                if (length > 400) {
                    charCounter.style.color = '#ff5a87';
                } else {
                    charCounter.style.color = '#999';
                }
            }
            
            function formatMessage(text) {
                // Convert plain text to HTML with line breaks
                return text.replace(/\n/g, '<br>')
                           .replace(/❤️/g, '<span style="color: #ff5a87;">❤️</span>')
                           .replace(/💕/g, '<span style="color: #ff5a87;">💕</span>')
                           .replace(/💖/g, '<span style="color: #ff5a87;">💖</span>')
                           .replace(/💘/g, '<span style="color: #ff5a87;">💘</span>')
                           .replace(/💝/g, '<span style="color: #ff5a87;">💝</span>');
            }
            
            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
            
            function createHeart(container) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                
                // Random size
                const size = 0.5 + Math.random() * 1.5;
                const scale = size + 'em';
                heart.style.fontSize = scale;
                
                // Random position and movement
                const startX = Math.random() * 100;
                const translateX = (Math.random() - 0.5) * 100;
                heart.style.left = startX + 'vw';
                heart.style.setProperty('--tx', translateX + 'px');
                
                // Random delay
                const delay = Math.random() * 20;
                heart.style.animationDelay = delay + 's';
                
                container.appendChild(heart);
            }
            
            function createRosePetal(container) {
                const petal = document.createElement('div');
                petal.classList.add('rose-petal');
                
                // Random position
                const startX = Math.random() * 100;
                petal.style.left = startX + 'vw';
                
                // Random size
                const size = 0.7 + Math.random() * 0.6;
                petal.style.transform = `scale(${size})`;
                
                // Random horizontal drift and rotation
                const translateX = (Math.random() - 0.5) * 200;
                const rotate = Math.random() * 360;
                petal.style.setProperty('--tx', translateX + 'px');
                petal.style.setProperty('--rotate', rotate + 'deg');
                
                // Random delay
                const delay = Math.random() * 30;
                petal.style.animationDelay = delay + 's';
                
                container.appendChild(petal);
            }
            
            // Update character counter on load
            updateCharCounter();
        });
    </script>
</body>
</html>
